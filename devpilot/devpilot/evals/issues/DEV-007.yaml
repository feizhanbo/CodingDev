id: DEV-007
title: Prevent duplicate order payment
description: In this task-specific starting point, pay_order lacks a status guard.
  Only pending orders may be paid; paid/shipped/cancelled/completed orders must return
  HTTP 409 and remain unchanged.
acceptance_criteria:
- Paying a paid order returns HTTP 409
- Paying a shipped order returns HTTP 409
- Paying a cancelled order returns HTTP 409
- Paying a pending order works as before
- Must add tests for duplicate payment prevention
constraints:
- Do not change API response schema
metadata:
  dataset_version: v1.1
