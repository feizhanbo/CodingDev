id: DEV-002
title: Prevent invalid order cancellation
description: |
  禁止 shipped 和 completed 状态的订单被取消。
  当前 cancel_order 不检查状态规则，允许任何状态转换到 cancelled。
  需要添加状态校验，拒绝无效转换。
acceptance_criteria:
  - shipped -> cancelled 返回 HTTP 409
  - completed -> cancelled 返回 HTTP 409
  - pending -> cancelled 保持正常
  - paid -> cancelled 保持正常
  - 必须新增回归测试
constraints:
  - 不修改 API response schema
  - 不影响现有合法转换
