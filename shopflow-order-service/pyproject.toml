[project]
name = "shopflow-order-service"
version = "0.1.0"
description = "ShopFlow Order Service - FastAPI mock backend for DevPilot"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "sqlalchemy>=2.0",
    "pydantic>=2",
    "uvicorn[standard]",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx",
    "ruff",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"app/models/*.py" = ["F821"]
"app/api/*.py" = ["B008"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
